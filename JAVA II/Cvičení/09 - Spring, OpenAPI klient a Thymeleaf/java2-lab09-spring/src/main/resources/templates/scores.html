<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nejlepší hráči</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 50px;
            background-color: #f8f9fa;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 table-container">
            <h2 class="text-center mb-4 text-primary">🏆 Tabulka nejlepších hráčů</h2>

            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th scope="col"># ID</th>
                    <th scope="col">Přezdívka v hře</th>
                    <th scope="col">Dosažená úroveň</th>
                    <th scope="col">Celkové skóre</th>
                    <th scope="col">Propojený profil</th>
                </tr>
                </thead>
                <tbody class="table-group-divider">
                <tr th:each="score : ${scores}">
                    <th scope="row" th:text="${score.id}">1</th>
                    <td th:text="${score.nickName}">Neznámý</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${score.level}">EASY</span>
                    </td>
                    <td class="fw-bold text-success" th:text="${score.score}">0</td>
                    <td
                            th:text="${score.player != null ? score.player.firstName + ' ' + score.player.lastName : 'Nepřihlášený (Anonymní)'}">
                        -</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
</body>

</html>
